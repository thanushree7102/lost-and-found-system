<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Data Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        pre { 
            background: #1e293b; 
            color: #e2e8f0; 
            padding: 1rem; 
            border-radius: 0.5rem; 
            overflow-x: auto;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Database Data Viewer</h1>
        
        <div class="mb-4 flex gap-4">
            <button onclick="loadData()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                Refresh Data
            </button>
            <a href="/" class="bg-gray-600 text-white px-6 py-2 rounded-lg hover:bg-gray-700">
                Back to Website
            </a>
        </div>

        <div id="loading" class="hidden text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
            <p class="mt-2 text-gray-600">Loading data...</p>
        </div>

        <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            <p id="errorMessage"></p>
        </div>

        <div id="dataContainer" class="space-y-6">
            <!-- Data will be displayed here -->
        </div>
    </div>

    <script>
        async function loadData() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const errorMessage = document.getElementById('errorMessage');
            const container = document.getElementById('dataContainer');
            
            loading.classList.remove('hidden');
            error.classList.add('hidden');
            container.innerHTML = '';

            try {
                const response = await fetch('http://localhost:5000/api/admin/view');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch data');
                }

                // Display Summary
                container.innerHTML = `
                    <div class="bg-white rounded-lg shadow p-6 mb-6">
                        <h2 class="text-2xl font-bold mb-4 text-gray-800">Summary</h2>
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                            <div class="bg-blue-50 p-4 rounded">
                                <p class="text-sm text-gray-600">Total Users</p>
                                <p class="text-2xl font-bold text-blue-600">${data.summary.totalUsers}</p>
                            </div>
                            <div class="bg-green-50 p-4 rounded">
                                <p class="text-sm text-gray-600">Total Items</p>
                                <p class="text-2xl font-bold text-green-600">${data.summary.totalItems}</p>
                            </div>
                            <div class="bg-yellow-50 p-4 rounded">
                                <p class="text-sm text-gray-600">Total Claims</p>
                                <p class="text-2xl font-bold text-yellow-600">${data.summary.totalClaims}</p>
                            </div>
                            <div class="bg-purple-50 p-4 rounded">
                                <p class="text-sm text-gray-600">Active Items</p>
                                <p class="text-2xl font-bold text-purple-600">${data.summary.activeItems}</p>
                            </div>
                            <div class="bg-orange-50 p-4 rounded">
                                <p class="text-sm text-gray-600">Pending Claims</p>
                                <p class="text-2xl font-bold text-orange-600">${data.summary.pendingClaims}</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <h2 class="text-2xl font-bold mb-4 text-gray-800">Users (${data.users.length})</h2>
                        <pre>${JSON.stringify(data.users, null, 2)}</pre>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <h2 class="text-2xl font-bold mb-4 text-gray-800">Items (${data.items.length})</h2>
                        <pre>${JSON.stringify(data.items, null, 2)}</pre>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <h2 class="text-2xl font-bold mb-4 text-gray-800">Claims (${data.claims.length})</h2>
                        <pre>${JSON.stringify(data.claims, null, 2)}</pre>
                    </div>
                `;

            } catch (err) {
                errorMessage.textContent = `Error: ${err.message}. Make sure the server is running and MongoDB is connected.`;
                error.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
