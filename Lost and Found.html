<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404Found✅ L&F - Security Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        darkcard: '#1e293b'
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .dark ::-webkit-scrollbar-track { background: #1e293b; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-darkbg dark:text-white transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons ---
        const Icon = ({ d, color = "currentColor", size = 20, className = "", fill="none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d={d} /></svg>
        );

        const Icons = {
            Search: (props) => <Icon d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" {...props} />,
            MapPin: (props) => <Icon d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z M12 10a3 3 0 100-6 3 3 0 000 6z" {...props} />,
            ShieldCheck: (props) => <svg xmlns="http://www.w3.org/2000/svg" width={props.size || 20} height={props.size || 20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={props.className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>,
            PlusCircle: (props) => <Icon d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z M12 8v8 M8 12h8" {...props} />,
            User: (props) => <Icon d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2 M12 11a4 4 0 100-8 4 4 0 000 8z" {...props} />,
            CheckCircle: (props) => <Icon d="M22 11.08V12a10 10 0 11-5.93-9.14 M22 4L12 14.01l-3-3" {...props} />,
            EyeOff: (props) => <Icon d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22" {...props} />,
            Clock: (props) => <Icon d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z M12 6v6l4 2" {...props} />,
            AlertTriangle: (props) => <Icon d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z M12 9v4 M12 17h.01" {...props} />,
            LogOut: (props) => <Icon d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4 M16 17l5-5-5-5 M21 12H9" {...props} />,
            X: (props) => <Icon d="M18 6L6 18 M6 6l12 12" {...props} />,
            Mail: (props) => <Icon d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z M22 6l-10 7L2 6" {...props} />,
            Scan: (props) => <Icon d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M12 8v8M8 12h8" {...props} />,
            Camera: (props) => <Icon d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z M12 13a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" {...props} />,
            Upload: (props) => <Icon d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12" {...props} />,
            Lock: (props) => <Icon d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" {...props} />,
            Trophy: (props) => <Icon d="M8 21h8M12 17v4M7 4h10c0 6 3 6 3 9a5 5 0 01-10 0c0-3 3-3 3-9zM17 4a5 5 0 00-10 0" {...props} />,
            Medal: (props) => <Icon d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15" {...props} />,
            Gift: (props) => <Icon d="M20 12v10H4V12M2 7h20v5H2V7zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" {...props} />,
            Sparkles: (props) => <Icon d="M5 3l3.057-3 1.334 2.909L12 5l-3 3-1-2-2 1z" {...props} />,
            MessageCircle: (props) => <Icon d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" {...props} />,
            Moon: (props) => <Icon d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" {...props} />,
            Sun: (props) => <Icon d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" {...props} />
        };

        // --- Mock Data ---
        const CATEGORIES = ['Electronics', 'IDs & Cards', 'Clothing', 'Books', 'Keys', 'Other'];
        // No example/demo items — real data will come from the backend
        const INITIAL_ITEMS = [];

        // --- API Helper Functions ---
        const API_BASE = window.location.origin;
        
        const apiCall = async (endpoint, options = {}) => {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...(token && { 'Authorization': `Bearer ${token}` }),
                ...options.headers
            };
            
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    ...options,
                    headers
                });
                
                // Check if response has content
                const contentType = response.headers.get("content-type");
                let data;
                
                if (contentType && contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    try {
                        data = JSON.parse(text);
                    } catch {
                        throw new Error(text || 'Request failed');
                    }
                }
                
                if (!response.ok) {
                    throw new Error(data.error || data.message || data || 'Request failed');
                }
                return data;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        };

        // --- Components ---
        const LoginScreen = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegister, setIsRegister] = useState(false);
            const [campusId, setCampusId] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                
                // Simple validation - check if email has @
                if (!email || !email.includes('@')) {
                    setError('Please enter a valid email address (must contain @)');
                    return;
                }
                
                if (!password || password.length < 3) {
                    setError('Password must be at least 3 characters');
                    return;
                }
                
                setLoading(true);
                
                try {
                    if (isRegister) {
                        // Register new user
                        const data = await apiCall('/api/users/register', {
                            method: 'POST',
                            body: JSON.stringify({ email, password })
                        });
                        alert('Registration successful! Please login.');
                        setIsRegister(false);
                        setCampusId('');
                        setPassword('');
                    } else {
                        // Login
                        const data = await apiCall('/api/users/login', {
                            method: 'POST',
                            body: JSON.stringify({ email, password })
                        });
                        if (data.token && data.user) {
                            localStorage.setItem('token', data.token);
                            onLogin({
                                id: data.user._id || data.user.id,
                                name: data.user.email ? data.user.email.split('@')[0] : 'User',
                                email: data.user.email || '',
                                role: data.user.role || 'student',
                                campus_id: data.user.campusId || '',
                                points: data.user.points || 0
                            });
                        } else {
                            throw new Error('Invalid response from server');
                        }
                    }
                } catch (err) {
                    setError(err.message || 'Operation failed. Please try again.');
                } finally {
                    setLoading(false);
                }
            };

            const handleAdminDemo = async () => {
                // Passwordless one-click admin: immediately grant a client-side demo admin session
                // This lets you open the Admin UI without entering credentials. Backend calls that
                // require real auth will fail unless a real admin exists on the server; we attempt
                // to seed it in the background but it is non-blocking.
                try {
                    const demoToken = 'demo-admin-' + Math.random().toString(36).slice(2);
                    localStorage.setItem('token', demoToken);
                    onLogin({
                        id: 'demo-admin',
                        name: 'Admin (Demo)',
                        email: 'admin@demo.local',
                        role: 'admin',
                        campus_id: ''
                    });

                    // Note: this is a client-only demo. No password is required or stored here.
                } catch (err) {
                    alert('Error starting demo admin: ' + (err.message || err));
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-indigo-900 to-blue-800 p-4">
                    <div className="bg-white dark:bg-darkcard rounded-3xl shadow-2xl w-full max-w-4xl flex overflow-hidden animate-slide-up">
                        {/* Left Side */}
                        <div className="hidden md:flex w-1/2 bg-indigo-50 dark:bg-slate-800 p-12 flex-col justify-between relative overflow-hidden">
                            <div className="z-10">
                                <div className="flex items-center mb-6">
                                    <div className="bg-yellow-400 p-2 rounded-lg mr-3">
                                        <Icons.ShieldCheck size={32} className="text-indigo-900"/>
                                    </div>
                                    <span className="font-extrabold text-2xl text-indigo-900 dark:text-white tracking-wider">404Found✅</span>
                                </div>
                                <h2 className="text-3xl font-bold text-indigo-900 dark:text-indigo-200 mb-4">Lost it? Found it?<br/>We sort it.</h2>
                                <p className="text-indigo-600 dark:text-indigo-300 text-lg leading-relaxed">The official centralized portal for safe and secure item recovery on campus.</p>
                            </div>
                            <div className="absolute -bottom-20 -right-20 w-64 h-64 bg-indigo-200 dark:bg-indigo-900 rounded-full opacity-50"></div>
                        </div>

                        {/* Right Side */}
                        <div className="w-full md:w-1/2 p-12 flex flex-col justify-center">
                            <h3 className="text-2xl font-bold text-gray-800 dark:text-white mb-2">{isRegister ? 'Create Account' : 'Campus Login'}</h3>
                            <p className="text-gray-500 dark:text-gray-400 mb-8">{isRegister ? 'Register a new account' : 'Please enter your campus credentials.'}</p>

                            {error && <div className="mb-4 p-3 bg-red-100 dark:bg-red-900/30 border border-red-400 text-red-700 dark:text-red-300 rounded-lg text-sm">{error}</div>}

                            <form onSubmit={handleSubmit} className="space-y-6">
                                {isRegister && (
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Campus ID (Optional)</label>
                                        <div className="relative">
                                            <Icons.User className="absolute left-4 top-3.5 text-gray-400" size={20} />
                                            <input type="text" className="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition" placeholder="STU-2024-001" value={campusId} onChange={(e) => setCampusId(e.target.value)} />
                                        </div>
                                    </div>
                                )}
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">College Email ID</label>
                                    <div className="relative">
                                        <Icons.Mail className="absolute left-4 top-3.5 text-gray-400" size={20} />
                                        <input type="email" required className="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition" placeholder="student@college.edu" value={email} onChange={(e) => setEmail(e.target.value)} />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Password</label>
                                    <div className="relative">
                                        <Icons.Lock className="absolute left-4 top-3.5 text-gray-400" size={20} />
                                        <input type="password" required className="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 dark:border-gray-600 dark:bg-slate-700 dark:text-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition" placeholder="••••••••" value={password} onChange={(e) => setPassword(e.target.value)} />
                                    </div>
                                </div>
                                <button type="submit" disabled={loading} className="w-full bg-indigo-900 text-white font-bold py-4 rounded-xl hover:bg-indigo-800 transition shadow-lg transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                                    {loading ? 'Please wait...' : (isRegister ? 'Register' : 'Access Portal')}
                                </button>
                            </form>

                            <div className="mt-4 text-center">
                                <button type="button" onClick={() => { setIsRegister(!isRegister); setError(''); }} className="text-indigo-600 dark:text-indigo-400 hover:underline text-sm">
                                    {isRegister ? 'Already have an account? Login' : "Don't have an account? Register"}
                                </button>
                            </div>

                            <div className="mt-6 pt-6 border-t border-gray-100 dark:border-slate-700">
                                <button onClick={handleAdminDemo} className="w-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold py-3 rounded-xl hover:bg-slate-300 dark:hover:bg-slate-600 transition flex items-center justify-center">
                                    <Icons.Lock size={18} className="mr-2"/> Login as Admin (Demo)
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Navbar = ({ user, setUser, setView, isDarkMode, toggleDarkMode, onLogout }) => (
            <nav className="bg-indigo-900 dark:bg-slate-900 text-white shadow-lg sticky top-0 z-40 transition-colors">
                <div className="max-w-7xl mx-auto px-4">
                    <div className="flex items-center justify-between h-16">
                        <div className="flex items-center cursor-pointer" onClick={() => setView('home')}>
                            <Icons.ShieldCheck className="h-8 w-8 text-yellow-400 mr-2" />
                            <div className="flex flex-col">
                                <span className="font-bold text-xl tracking-wider leading-none">404Found✅</span>
                                <span className="text-indigo-300 text-xs font-light tracking-widest">LOST & FOUND</span>
                            </div>
                        </div>
                        <div className="flex items-center space-x-4">
                            <button onClick={toggleDarkMode} className="p-2 rounded-full hover:bg-indigo-800 dark:hover:bg-slate-800 transition">
                                {isDarkMode ? <Icons.Sun size={20} /> : <Icons.Moon size={20} />}
                            </button>
                            {user ? (
                                <>
                                    <div className="hidden sm:flex flex-col items-end mr-2">
                                        <span className="text-sm font-bold">{user.name}</span>
                                        <span className="text-[10px] text-indigo-300 uppercase tracking-wide">{user.role === 'admin' ? 'ADMINISTRATOR' : user.campus_id}</span>
                                    </div>
                                    <button onClick={onLogout || (() => setUser(null))} className="bg-indigo-800 hover:bg-indigo-700 dark:bg-slate-800 p-2 rounded-lg text-indigo-200 hover:text-white transition"><Icons.LogOut size={18} /></button>
                                </>
                            ) : (
                                <button className="bg-yellow-500 text-indigo-900 px-4 py-2 rounded-lg font-bold text-sm">Login</button>
                            )}
                        </div>
                    </div>
                </div>
            </nav>
        );

        const ItemCard = ({ item, onViewDetails }) => {
            const isFound = item.type === 'found';
            return (
                <div className="bg-white dark:bg-darkcard rounded-xl shadow-sm hover:shadow-lg transition duration-300 border border-gray-100 dark:border-slate-700 overflow-hidden flex flex-col h-full">
                    <div className={`h-2 w-full ${isFound ? 'bg-green-500' : 'bg-red-500'}`} />
                    <div className="p-5 flex flex-col flex-grow">
                        <div className="flex justify-between items-start mb-2">
                            <span className={`text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wide ${isFound ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>{isFound ? 'Found Item' : 'Lost Report'}</span>
                            <span className="text-gray-400 text-xs flex items-center"><Icons.Clock size={12} className="mr-1"/> {item.date}</span>
                        </div>
                        <div className="flex justify-between items-start">
                            <h3 className="font-bold text-lg text-gray-800 dark:text-white mb-1">{item.title}</h3>
                            {item.reward && <div className="bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full text-[10px] font-bold flex items-center whitespace-nowrap ml-2"><Icons.Gift size={10} className="mr-1"/> ₹{item.reward}</div>}
                        </div>
                        <div className="flex flex-wrap gap-1 mb-3 mt-1">
                            {item.smart_tags?.map(tag => <span key={tag} className="text-[10px] bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-full border border-slate-200 dark:border-slate-600">#{tag}</span>)}
                        </div>
                        <div className="mt-auto flex items-center text-sm text-gray-600 dark:text-gray-400 bg-gray-50 dark:bg-slate-800 p-2 rounded border border-gray-100 dark:border-slate-700 mb-4">
                            <Icons.MapPin size={16} className="mr-2 text-indigo-500 flex-shrink-0" />
                            {isFound ? <span className="italic flex items-center">{item.general_area} <Icons.EyeOff size={14} className="ml-2 text-gray-400"/></span> : <span className="font-medium">{item.location_lost}</span>}
                        </div>
                        <button onClick={() => onViewDetails(item)} className={`w-full py-2 rounded border font-bold transition ${isFound ? 'border-green-200 text-green-700 hover:bg-green-50 dark:hover:bg-green-900' : 'border-indigo-100 text-indigo-600 hover:bg-indigo-50 dark:hover:bg-indigo-900'}`}>{isFound ? 'Is this yours?' : 'View Details'}</button>
                        {isFound && <button onClick={() => window.open(`https://wa.me/?text=Found: ${item.title} at 404Found✅!`)} className="text-green-600 dark:text-green-400 text-xs font-bold flex items-center justify-center mt-3 hover:underline"><Icons.MessageCircle size={14} className="mr-1"/> Share on WhatsApp</button>}
                    </div>
                </div>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-white dark:bg-darkcard dark:text-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden animate-pop">
                        <div className="bg-gray-50 dark:bg-slate-800 px-6 py-4 border-b dark:border-slate-700 flex justify-between items-center">
                            <h3 className="font-bold text-lg text-gray-800 dark:text-white">{title}</h3>
                            <button onClick={onClose}><Icons.X size={20} className="text-gray-400 hover:text-gray-200"/></button>
                        </div>
                        <div className="p-6 max-h-[80vh] overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        // --- Main Application ---
        function FoundApp() {
            const [user, setUser] = useState(null);
            const [items, setItems] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [currentModal, setCurrentModal] = useState(null);
            const [reportType, setReportType] = useState('found'); 
            const [selectedItem, setSelectedItem] = useState(null);
            const [claimStep, setClaimStep] = useState(0);
            const [verificationStatus, setVerificationStatus] = useState('idle');
            const [dropOffInstruction, setDropOffInstruction] = useState(null);
            const [loading, setLoading] = useState(false);

            // Load items from API
            const loadItems = async () => {
                if (!user || !user.id) return;
                
                try {
                    setLoading(true);
                    console.log('Loading items from API...');
                    const data = await apiCall('/api/items/search');
                    console.log('Items loaded:', data);
                    
                    // Transform API data to match frontend format
                    const transformedItems = (Array.isArray(data) ? data : []).map(item => ({
                        id: item._id || item.id,
                        type: item.type || 'found', // Preserve the type from database
                        title: item.title || 'Untitled',
                        category: item.category || 'Other',
                        general_area: item.generalArea || item.locationLost || 'Unknown',
                        location_lost: item.locationLost,
                        date: item.dateFound ? new Date(item.dateFound).toISOString().split('T')[0] : 
                              (item.dateLost ? new Date(item.dateLost).toISOString().split('T')[0] : 
                              new Date().toISOString().split('T')[0]),
                        status: item.status || 'active',
                        description: item.description || '',
                        smart_tags: [item.category || 'Other'],
                        reward: null,
                        pickupCode: item.pickupCode
                    }));
                    setItems(transformedItems);
                } catch (err) {
                    console.error('Failed to load items:', err);
                    // Set empty array but don't break the page
                    setItems([]);
                } finally {
                    setLoading(false);
                }
            };

            // Load items from API when user logs in
            useEffect(() => {
                if (user && user.id) {
                    console.log('User logged in, loading items...', user);
                    loadItems();
                }
            }, [user]); 

            const toggleDarkMode = () => {
                setIsDarkMode(!isDarkMode);
                if (!isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            };

            const filteredItems = items.filter(item => item.title.toLowerCase().includes(searchQuery.toLowerCase()) || item.category.toLowerCase().includes(searchQuery.toLowerCase()));

            const handleLogin = (userData) => {
                console.log('handleLogin called with:', userData);
                try {
                    if (userData) {
                        // Ensure user has required fields
                        const validUser = {
                            id: userData.id || userData._id || 'temp-' + Date.now(),
                            name: userData.name || userData.email?.split('@')[0] || 'User',
                            email: userData.email || '',
                            role: userData.role || 'student',
                            campus_id: userData.campus_id || userData.campusId || '',
                            points: userData.points || 0
                        };
                        console.log('Setting user:', validUser);
                        setUser(validUser);
                        console.log('User state set successfully');
                    } else {
                        console.error('Invalid userData:', userData);
                        alert('Login failed: Invalid user data received');
                    }
                } catch (error) {
                    console.error('Error in handleLogin:', error);
                    alert('Login error: ' + error.message);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                setUser(null);
                setItems([]);

            const handleReportSubmit = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                
                    try {
                    setLoading(true);
                    const itemData = {
                        title: formData.get('title'),
                        description: formData.get('description'),
                        category: formData.get('category'),
                        type: reportType, // 'found' or 'lost'
                        dateFound: reportType === 'found' ? (formData.get('date') || new Date()) : null,
                        dateLost: reportType === 'lost' ? (formData.get('date') || new Date()) : null,
                        generalArea: reportType === 'found' ? formData.get('general_area') : null,
                        locationLost: reportType === 'lost' ? formData.get('location') : null,
                        status: reportType === 'found' ? 'pending_dropoff' : 'active'
                    };

                    const savedItem = await apiCall('/api/items', {
                        method: 'POST',
                        body: JSON.stringify(itemData)
                    });

                    // Reload items to get the new one
                    await loadItems();
                    
                    setCurrentModal(null);
                    if (reportType === 'found') {
                        alert("Found item reported! Please hand it over at the Security Desk.");
                    } else {
                        alert("Lost report submitted.");
                    }

                    alert('Failed to submit report: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const simulateGmailScan = () => {
                setVerificationStatus('scanning');
                setTimeout(() => setVerificationStatus('verified'), 2000);

            const generatePickupCode = (itemId) => {
                // Robust generator: prefer a deterministic small numeric code derived from itemId.
                // If itemId is missing or produces invalid number, use a stable session fallback.
                try {
                    if (itemId !== undefined && itemId !== null) {
                        const s = String(itemId);
                        // simple hash (djb2 variant)
                        let h = 5381;
                        for (let i = 0; i < s.length; i++) {
                            h = ((h << 5) + h) + s.charCodeAt(i); // h * 33 + c
                        }
                        const num = Math.abs(h) % 1000; // 000-999
                        return `PICK-${String(num).padStart(3, '0')}-SECURE`;
                    }
                } catch (e) {
                    // fall through to fallback
                }

                // Fallback: session-stable random 3-digit code per missing id
                try {
                    const key = 'pickup_fallbacks_v1';
                    const raw = sessionStorage.getItem(key) || '{}';
                    const map = JSON.parse(raw);
                    const idKey = itemId ? String(itemId) : '__unknown__';
                    if (!map[idKey]) {
                        const rand = Math.floor(Math.random() * 1000); // 0-999
                        map[idKey] = String(rand).padStart(3, '0');
                        sessionStorage.setItem(key, JSON.stringify(map));
                    }
                    return `PICK-${map[idKey]}-SECURE`;
                } catch (e) {
                    // Last resort: generate an ephemeral non-NaN numeric code
                    const r = Math.floor(Math.random() * 900) + 100; // 100-999
                    return `PICK-${r}-SECURE`;
                }
            };

            // Show login screen if no user
            if (!user || !user.id) {
                return <LoginScreen onLogin={handleLogin} />;
            }

            console.log('Rendering main app for user:', user);

                                                <input type="text" placeholder="e.g. PICK-099-SECURE" className="w-full border-2 border-indigo-300 dark:border-indigo-600 dark:bg-slate-800 rounded-xl p-4 text-xl font-mono text-center tracking-widest mb-3 uppercase" 
                                                    onKeyPress={(e) => {

                        {selectedItem && (

                                {claimStep === 2 && (
                                    <div className="space-y-5">
                                        <h3 className="font-bold text-lg dark:text-white">Answer to prove ownership:</h3>
                                        {["Where exactly was it lost?", "Any sticker or name written?", "What was inside?"].map((q, i) => (
                                          <div key={i}>
                                            <p className="font-medium text-sm mb-2 text-gray-600 dark:text-gray-400">{q}</p>
                                            <input type="text" className="w-full border dark:border-slate-600 dark:bg-slate-700 rounded-lg p-3 dark:text-white" placeholder="Your answer..." />
                                          </div>
                                        ))}
                                        <div className="flex space-x-3 pt-2">
                                            <button onClick={() => setClaimStep(0)} className="flex-1 py-3 bg-gray-100 dark:bg-slate-700 font-bold rounded-lg dark:text-white">Back</button>
                                            <button onClick={() => alert("Answers submitted for Auto-Verification!")} className="flex-1 py-3 bg-green-600 text-white font-bold rounded-lg">Verify Answers</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </Modal>
                </div>
            );
        }

        // Render the app with error boundary
        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<FoundApp />);
        } catch (error) {
            console.error('Failed to render app:', error);
            document.getElementById('root').innerHTML = `
                <div style="padding: 20px; text-align: center;">
                    <h1>Error Loading Application</h1>
                    <p>${error.message}</p>
                    <button onclick="window.location.reload()">Reload Page</button>
                </div>
            `;
        }
    </script>
</body>
</html>
